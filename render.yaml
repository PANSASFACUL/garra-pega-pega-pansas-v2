# Blueprint do Render: site estático gerado pelo Vite
services:
  - type: web
    runtime: static
    name: garra-pega-pega-ra
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      # o iPhone só abre a realidade aumentada (Quick Look) com este tipo
      - path: /*.usdz
        name: Content-Type
        value: model/vnd.usdz+zip
      - path: /*.glb
        name: Content-Type
        value: model/gltf-binary
      - path: /models/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
